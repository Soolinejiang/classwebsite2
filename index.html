        const articles = [

            {

                title: "温情人间",

                author: "徐芝润",

                content: "人间最动人的温情，从来不藏在轰轰烈烈的大事里，而是藏在一碗汤、一盏灯、一句轻声的叮嘱中。这些细碎的温暖，像冬日里的一缕阳光，悄无声息地照进我的生活，成为我记忆中最柔软的部分。\n\n那是去年深秋的一个夜晚，窗外的风呼呼地刮着，枯黄的树叶被卷起，啪啪地拍打着玻璃。我坐在书桌前，面前堆着写不完的试卷和密密麻麻的笔记。台灯的光照得我眼睛发酸，手指因为长时间握笔而有些僵硬。墙上的时钟已经悄悄滑过了十点。\n\"还没睡呢?\"母亲轻手轻脚地推开门，手里端着一碗热气腾腾的汤。白色的雾气氤氲而上，模糊了她略显疲惫的面容，却清晰地映出她关切的眼神。\"趁热喝吧，补补身子。\"她的声音很轻，像怕惊扰了我的思绪。\n我放下笔，接过碗。指尖触碰到碗壁的那一刻，一股暖意顺着指尖蔓延到全身。碗里的汤飘着淡淡的清香，是我最爱喝的排骨莲藕汤。莲藕炖得软糯，排骨熬出了浓郁的汤汁，表面还浮着几颗红枣。我小口啜饮着，温热的液体顺着喉咙滑入胃里，瞬间驱散了周身的寒意，也融化了心中积攒了一整天的疲惫。\n母亲没有多说什么，只是静静地站在一旁，看着我喝完。她粗糙的手指轻轻抚过我的发梢，那动作里藏着无尽的包容与爱意。灯光下，我突然发现她的鬓角不知何时多了几缕银丝，在暖黄色的光里显得格外刺眼。\n那一刻，我忽然意识到，在这快节奏的生活里，这份无声的陪伴是多么珍贵。母亲的爱，从来不是轰轰烈烈的宣言，而是藏在这些细枝末节里的温情--是一碗热汤，是一次轻手轻脚的进门，是一个关切的眼神，是无数个深夜里默默守候的身影。\n\n如今，每当我在深夜伏案时，总会想起那碗汤的温度。它让我明白，温情无处不在，它藏在生活的每一个角落，等待着我们去发现、去珍惜。而我也渐渐懂得，最好的回报，不是华丽的承诺，而是用自己的努力，让那些默默守候的人放心、骄傲。\n\n一碗汤的温度，足以抵御世间所有的严寒。这就是温情人间--平凡，却足够温暖。"

            },

            {

                title: "一笺四季，满目芳华",

                author: "徐芝润",

                content: "日升日落，春秋代序，自然以四季为笔，蘸取不同景致的墨色，在天地间铺展成一幅幅鲜活的画卷。每一个季节都有自己独特的灵魂，等待着我们去发现、去感受。\n春天，是万物苏醒的季节。当第一缕春风拂过大地，沉睡了一冬的小草便悄悄探出了嫩绿的脑袋，好奇地打量着这个世界。柳树的枝条也变得柔软起来，像少女的长发在风中轻轻摇曳。桃花、杏花、梨花竞相开放，粉的像霞，白的像雪，红的像火，把山坡染成了五彩斑斓的画布。春雨绵绵，细如牛毛，落在脸上凉丝丝的，带着泥土和青草的芬芳。解冻的小溪叮叮咚咚地唱着歌，仿佛在诉说着春天的故事。燕子从南方飞回来了，在屋檐下忙碌地筑巢，叽叽喳喳的叫声为春天增添了无限的生机。走在春天的田野里，深吸一口气，满是清新的气息，让人心旷神怡。\n夏天，是热情奔放的季节。清晨，太阳早早地爬上了天空，金色的阳光洒满大地，树叶被照得发亮，绿得发黑。中午，蝉在树梢上不知疲倦地叫着\"知了知了\"，声音此起彼伏，像是在举行一场盛大的音乐会。池塘里，荷花盛开了，粉的、白的，亭亭玉立地站在碧绿的荷叶之间，微风吹过，送来阵阵清香。傍晚时分，一场突如其来的暴雨倾盆而下，雨点打在窗户上噼里啪啦地响，天地间仿佛挂起了一道巨大的水帘。雨过天晴后，天边架起了一道彩虹，空气格外清新，青蛙在稻田里呱呱地叫着，萤火虫在草丛中一闪一闪，像天上的星星落了下来。夏夜的星空格外明亮，躺在院子里的竹椅上数星星，是童年最难忘的记忆。\n秋天，是成熟丰收的季节。秋风送爽，天空变得格外高远，蓝得像一块巨大的宝石。走在乡间的小路上，放眼望去，金黄的稻田像铺了一地的黄金，沉甸甸的稻穗笑弯了腰。果园里，红彤彤的苹果挂满枝头，黄澄澄的梨子散发着诱人的香气，紫莹莹的葡萄像一串串玛瑙。枫叶红了，一片片像燃烧的火焰，风一吹，便如蝴蝶般翩翩起舞，落在地上铺成了一条红色的地毯。踩上去发出\"沙沙\"的响声，那是秋天独有的声音。秋天的夜晚，月光格外皎洁，桂花开了，香气能飘到很远很远的地方。坐在窗前，闻着桂花香，读一本喜欢的书，是一种说不出的惬意。\n\n冬天，是静谧纯净的季节。清晨推开窗，外面已经变成了一个银装素裹的世界。雪花还在纷纷扬扬地飘落，像无数只白色的蝴蝶在空中飞舞。屋顶上、树枝上、地面上，全都盖上了一层厚厚的棉被。整个世界安静极了，只有脚踩在雪地上发出“咯吱咯吱”的声音。光秃秃的树枝上挂满了晶莹剔透的冰凌，在阳光下闪闪发光。墙角处，几朵梅花傲然绽放，红的、白的，在皑皑白雪中显得格外娇艳，散发着淡淡的清香。孩子们穿着厚厚的棉衣，在雪地里堆雪人、打雪仗，欢声笑语回荡在整个小院。屋子里，一家人围坐在火炉旁，喝着热腾腾的姜茶，窗外寒风呼啸，屋内却暖意融融，这就是冬天最温暖的画面。\n春生夏长，秋收冬藏，四时交替，各有风华。春天的希望、夏天的热情、秋天的充实、冬天的宁静，构成了生命最完整的循环。我们应该珍惜每一个季节，珍惜每一个时刻，因为每一个季节，都是大自然赠予我们最珍贵的礼物。用心去感受四季的变化，你会发现，生活本身就是一首最美的诗。"

            },

            {

                title: "乡间美景",

                author: "谢意桐",

                content: "我喜欢乡间的美景，无论什么时候的乡间我都喜欢，它们给我的形象和记忆永远是最美的。\n清晨，当第一缕太阳穿过小山，第一束阳光照在云朵上，小山上，小溪里，天上的棉花糖在小贩手中变来变去，五颜六色的，远处的小山给一位画家画得活了过来，小溪在阳光的照耀下变成了金灿灿的，太阳透过澄清的水面照射在沙石上。\n下午，太阳炽烤着大地，有几个小孩蹦蹦跳跳的跑了过来，手里拿着渔网和小桶，这时太阳躲到了云朵后面好似不想让他们晒太多的太阳吧，太阳也许是想和云朵们讲悄悄话吧。\n傍晚，麻雀悠闲的在枝头歌唱，小溪“哗啦啦”的，在给小鸟伴奏，这时一阵风跑过，旁边的树丛也在“沙沙沙”作响，可能是想加入他们吧。\n夜幕降临，月亮高高的挂在天空，被月光照耀下的小溪，变成了一条银色的小溪，仿佛可以把整个大地照亮。当最后一抹月色洒在大地上，我忽然觉得这片土地不仅仅是树木、草、溪水和小鱼们。树木的茂盛是人们的滋润；小草的茂密是人们的保护；清水的清澈是人们的爱护。\n原来风景不仅仅只在眼前，还在心里，也在行动上，他用沉默的事物讲着关于生长，坚持与美好的故事。无论什么时候的乡间美景，我都喜欢。"

            },

            {

                title: "生活处处有风景",

                author: "严师琦",

                content: "风卷起满地的落叶，也卷走空气中的燥热。悠蓝的天空高远，干净得没有一丝杂质。风守护着大地，也守护了我心中的风景。\n初次见他时，他正坐在竹椅上逗狗。身后是一座新建的平房，身旁还长着一棵郁郁葱葱的桂花树。这个老伯看起来六十多岁，小麦肤色，脸上爬满皱纹，眼神似乎永远都在挑剔别人的刺。身上穿了一件洗得发白的蓝格子衬衫，背却挺得绷直，像他身旁那棵桂花树笔直的树干。听母亲说，他是刚搬来村里的，不大爱说话。我走上前打招呼：“您好！”他没理我，扬起手臂，对着那条咬住他裤角不放的老黄狗落下一掌：“坏狗，欠打！”我微微皱眉，小声嘀咕：“没礼貌！”\n等再见到他，已经是几天后。我在家门前的小公园散步，碰见老伯拿着扫把，不知道在扫些什么。\n他扫着扫着，一手扶着腰，神情有些难受。他看到我在一旁，叫住我：“小女娃，过来！”话里带着浓厚的北方口音。我将信将疑地走过去。他指着滑梯上的一个缕空：“帮我一一下。”我顺着他手指的方向看过去，那个缕空不高，却很小，里面塞了一个矿泉水瓶。我明白了他的意思，伸手进去扯出了那个矿泉水瓶，丢到扫斗里面。\n他点点头，像是在感谢我：“人老了腰就是不行。”说完接着用他那短粗的手握住扫把，手臂轻轻摆动，把垃圾扫进斗里。我发出疑问：“您的腰都这么不好了，怎么还要扫公园啊？”“人活在这道风景里，总要为它做点事。”他自顾自说着，手上的动作却不停。\n一刻钟后，他拿着扫把走向那个小平房，步伐依旧骄健。清风吹来，一阵桂花香飘来。我抬眼望去，桂花点点开在树上，像眼睛，像星星。\n风景需要守护，守护同样是一道风景。"

            },

            {

                title: "一粥知不易，惜粮守初心",

                author: "钟习诚",

                content: "金秋十月，路边的糖炒栗子香飘得老远，菜市场里新收的红薯、玉米堆得像小山，连楼下快餐店的橱窗里，都多了好几道用新米做的特色主食。10月16日世界粮食日，就安安静静藏在这股热热闹闹的烟火气里。\n可能很多人刷到这个日子的时候，第一反应是“哦，又是一个要宣传节约的日子”，转头就忘了。毕竟现在大家生活条件都好了，很少有人会为一口吃的发愁，超市里的米面粮油永远堆得满满当当，手机点几下，半小时就能有热乎的饭菜送到家门口。我们早就习惯了“想吃什么就能买到什么”的日子，慢慢就忘了，碗里那一碗白米饭，从秧苗长到我们餐桌上，要走好多好多路。\n你有没有在夏天路过乡下的稻田？正午的太阳晒得地面发烫，田埂上的草都蔫了，种稻的人还弯着腰在水田里忙活，裤腿全泡在泥水里，后背上的汗渍干了又湿。从春天播种、夏天浇水除虫，到秋天收割、脱粒、晒谷，再运到加工厂碾成白米，最后装车送到各个超市、菜市场，这中间要经过好几个月的时间，好多人的手才能把一碗饭端到我们面前。\n现在大家随手浪费粮食的场景，其实随处可见：学校食堂里，有的同学打饭的时候怕不够吃，一下盛满满一盘，吃不完就直接倒进泔水桶；朋友出去下馆子，总觉得点少了没面子，一大桌子菜最后剩一半，谁也不好意思打包；家里囤的零食、水果放忘了，等想起来的时候已经坏了，只能整袋整袋往垃圾桶扔。这些我们觉得“一点点”的浪费，攒到一起数字特别吓人：全国城市里的餐饮浪费，一年下来能有上千万吨，这些粮食够好几千万人吃一整年。\n你可能会说，我就倒半碗剩饭，能有什么影响？其实粮食这件事，从来都不是“我一个人浪费一点没关系”。你倒掉的那半碗饭，是农民在太阳底下晒好几天晒出来的稻谷，是货车司机连夜赶路运过来的物资，是好多人忙活了好几个月的心血。而且现在极端天气越来越多，夏天的大旱、秋天的暴雨，都会影响地里的收成，哪怕我们现在粮仓里的粮食够吃，也架不住大家一点点往外浪费。\n其实珍惜粮食这件事，根本不是什么“苦行僧”一样的要求，不需要你饿着肚子省饭，只要几个特别简单的小习惯就能做到。平时去食堂打饭，吃多少盛多少，不够了再去添；和朋友出去吃饭，先照着大家的饭量点，不够再加，吃不完的直接打包，一点都不丢人；家里买菜做饭，别一次性买太多，照着几天的量买，免得放坏了只能扔。这些小事做起来一点都不麻烦，却能把好多本来要被浪费的食物，好好吃到肚子里。\n今年世界粮食日的主题是“创新当下，粮安未来”，听起来好像挺宏大，落到我们每个人身上，其实就是好好吃眼前这顿饭。我们不用去田里种稻，也不用去研究新的农业技术，只要把手里的每一碗饭吃干净，不随便糟蹋食物，就是在给守住大家的饭碗出一份力。\n日子过得好了，我们当然可以吃得好、吃得香，但这从来不是我们浪费食物的理由。今天吃完晚饭的时候，低头看看自己的碗，要是碗里干干净净没有剩米粒，你就已经为这个世界的粮食安全，做了一件特别棒的小事。"

            }
,
            {

        let sortAsc = true; // 排序标记：true A→Z，false Z→A

        const articleListEl = document.getElementById('articleList');

        const searchInput = document.getElementById('searchInput');

        const sortBtn = document.getElementById('sortBtn');

        const backTopBtn = document.getElementById('backTop');



        // 截取预览文字

        function getPreview(text, len = 45) {

            if (text.length <= len) return text;

            return text.slice(0, len) + '...';

        }



        // 渲染列表

        function render() {

            const keyword = searchInput.value.trim().toLowerCase();

            // 过滤

            let filtered = articles.filter(item => item.title.toLowerCase().includes(keyword));

            // 排序

            filtered.sort((a,b)=>{

                if(sortAsc){

                    return a.title.localeCompare(b.title, 'zh-CN');

                }else{

                    return b.title.localeCompare(a.title, 'zh-CN');

                }

            })



            if(filtered.length === 0){

                articleListEl.innerHTML = `<div class="empty-tip">没有找到匹配的文章</div>`;

                return;

            }



            let html = '';

            filtered.forEach((item,idx)=>{

                html += `

                <div class="article-card" data-index="${idx}">

                    <div class="article-title">${item.title}</div>

                    <div class="article-author">作者：${item.author}</div>

                    <div class="article-preview">${getPreview(item.content)}</div>

                    <div class="article-content">${item.content}</div>

                </div>

                `

            })

            articleListEl.innerHTML = html;



            // 绑定点击展开

            document.querySelectorAll('.article-card').forEach(card=>{

                card.addEventListener('click',()=>{

                    const contentDom = card.querySelector('.article-content');

                    contentDom.classList.toggle('open');

                })

            })

        }



        // 搜索监听

        searchInput.addEventListener('input', render);



        // 排序按钮切换

        sortBtn.addEventListener('click',()=>{

            sortAsc = !sortAsc;

            sortBtn.innerText = sortAsc ? "按标题 A→Z 排序" : "按标题 Z→A 排序";

            render();

        })



        // 返回顶部

        window.addEventListener('scroll',()=>{

            if(window.scrollY > 300){

                backTopBtn.style.display = 'block';

            }else{

                backTopBtn.style.display = 'none';

            }

        })

        backTopBtn.addEventListener('click',()=>{

            window.scrollTo({top:0, behavior:'smooth'});

        })



        // 初始渲染

        render();

    </script>
